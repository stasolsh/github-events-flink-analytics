plugins {
    id 'application'
    id 'com.gradleup.shadow' version '8.3.5'
}

def flinkVersion = '2.0.0'
def kafkaConnectorVersion = '4.0.0-2.0'

dependencies {
    implementation "org.apache.flink:flink-streaming-java:${flinkVersion}"
    implementation "org.apache.flink:flink-clients:${flinkVersion}"
    implementation "org.apache.flink:flink-connector-kafka:${kafkaConnectorVersion}"
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'
    implementation 'org.slf4j:slf4j-simple:2.0.13'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
}

application {
    mainClass = 'com.example.github.flink.GithubEventsFlinkJob'
}

shadowJar {
    archiveBaseName.set('github-events-flink-job')
    archiveClassifier.set('')
    archiveVersion.set('1.0.0')
    mergeServiceFiles()
}
